<!DOCTYPE html>
<html>

<head>
    <title>Job Details - JobNest</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>
        <h1>Job Details</h1>
    </header>

    <section class="details">

        <h2 id="title"></h2>

        <p>
            <strong>Company:</strong>
            <span id="company"></span>
        </p>

        <p>
            <strong>Location:</strong>
            <span id="location"></span>
        </p>

        <p>
            <strong>Salary:</strong>
            <span id="salary"></span>
        </p>

        <p id="description"></p>



        <div class="button-container">

            <a href="../register/register.html">

                <button class="jobBtn">
                    Register Now
                </button>
            </a>

            <a href="jobs.html">
                <button class="jobBtn">
                    Back to Jobs
                </button>
            </a>

        </div>


    </section>

    <script src="jobDetails.js"></script>

</body>

</html>
